# Default profile: in-memory H2 database. Zero setup, resets on every restart.
spring.datasource.url=jdbc:h2:mem:dspbank;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
server.port=8080
