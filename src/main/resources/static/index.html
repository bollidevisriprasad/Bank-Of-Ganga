<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSP Bank</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14172b;--muted:#5d6280;--paper:#f4f5fa;--card:#fff;--line:#e2e4ef;--blue:#1e2a78;--blue2:#2c3b9e;--saffron:#f2a93b;--green:#1a7f55;--red:#b8353b;
--display:'Bricolage Grotesque',Georgia,serif;--body:'Instrument Sans',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--ink:#eceefb;--muted:#9aa0c4;--paper:#0f1226;--card:#171b38;--line:#2a2f57;--green:#4cc68f;--red:#ff7b80}}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.5 var(--body);color:var(--ink);background:var(--paper);min-height:100vh}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:.65rem 1.1rem;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}
.btn:hover{background:var(--blue2)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line)}.btn.sm{padding:.3rem .65rem;font-size:.85rem;border-radius:8px}.btn.danger{background:var(--red);color:#fff}
.btn.gold{background:var(--saffron);color:#1b1500}
input{width:100%;padding:.7rem .85rem;border-radius:10px;border:1px solid var(--line);background:var(--card)}
label{display:block;font-weight:500;font-size:.9rem;margin:.9rem 0 .3rem}
.muted{color:var(--muted)}.mono{font-variant-numeric:tabular-nums}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.brand{background:var(--blue);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.brand h1{font-size:clamp(2.4rem,5vw,4rem);max-width:12ch}
.brand p{max-width:34ch;color:#cdd2f5}
.brand .logo{font-family:var(--display);font-weight:700;font-size:1.3rem}
.cardnum{margin-top:2rem;max-width:360px;padding:1.2rem 1.4rem;border-radius:16px;background:linear-gradient(135deg,#2c3b9e,#161f5c);border:1px solid #ffffff22;transform:rotate(-3deg)}
.cardnum b{display:block;font:500 1.25rem var(--display);letter-spacing:.12em;margin:.8rem 0 .2rem}
.cardnum i{display:inline-block;width:38px;height:28px;border-radius:6px;background:var(--saffron)}
.panel{padding:3rem 2rem;display:flex;align-items:center;justify-content:center}
.form{width:100%;max-width:380px}
.tabs{display:flex;gap:.4rem;background:var(--line);padding:.3rem;border-radius:12px;margin-bottom:1.5rem}
.tabs button{flex:1;border:0;background:none;padding:.5rem;border-radius:9px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.form .btn{width:100%;margin-top:1.3rem}
.hint{font-size:.85rem;color:var(--muted);margin-top:1rem}
/* app */
.top{display:flex;justify-content:space-between;align-items:center;padding:1rem clamp(1rem,4vw,2.5rem);border-bottom:1px solid var(--line);background:var(--card)}
.top .logo{font:700 1.2rem var(--display)}
main{max-width:1000px;margin:0 auto;padding:2rem clamp(1rem,4vw,2.5rem) 4rem}
.hero{background:var(--blue);color:#fff;border-radius:20px;padding:2rem;display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:space-between;align-items:flex-end}
.hero .bal{font:700 clamp(2.4rem,7vw,4rem) var(--display);letter-spacing:-.02em}
.hero small{color:#c3c9f3;display:block}
.pill{display:inline-block;padding:.1rem .6rem;border-radius:99px;font-size:.8rem;font-weight:600;background:#ffffff26}
.pill.ok{background:#1a7f5522;color:var(--green)}.pill.bad{background:#b8353b22;color:var(--red)}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.2rem 0 2rem}
h2{font-size:1.4rem;margin:2rem 0 .8rem}
.table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.table th{text-align:left;font-weight:600;font-size:.85rem;color:var(--muted);padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.table td{padding:.75rem 1rem;border-bottom:1px solid var(--line)}.table tr:last-child td{border:0}
.wrap{overflow-x:auto}.in{color:var(--green);font-weight:600}.out{color:var(--red);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem}
.stat b{display:block;font:700 1.9rem var(--display)}
.row-actions{display:flex;gap:.3rem;flex-wrap:wrap}
.empty{padding:2rem;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px}
dialog{border:0;border-radius:18px;padding:1.6rem;width:min(92vw,400px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0b0e2299}
dialog .btns{display:flex;gap:.6rem;margin-top:1.3rem}dialog .btns .btn{flex:1;margin:0;width:auto}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);padding:.7rem 1.2rem;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.show{opacity:1}#toast.err{background:var(--red);color:#fff}
@media(max-width:800px){.auth{grid-template-columns:1fr}.brand{padding:2rem}.cardnum{display:none}.panel{padding:2rem 1.2rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const inr=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=d=>new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const TYPES={DEPOSIT:'Deposit',WITHDRAW:'Withdrawal',TRANSFER_OUT:'Transfer sent',TRANSFER_IN:'Transfer received'};
let session=JSON.parse(sessionStorage.getItem('dsp')||'null');

async function api(path,method='GET',body){
  const res=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json',...(session?{'X-Auth-Token':session.token}:{})},body:body?JSON.stringify(body):undefined});
  const data=await res.json().catch(()=>({}));
  if(res.status===401&&session){logout(true)}
  if(!res.ok)throw new Error(data.error||'Something went wrong.');
  return data;
}
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3200)}
async function run(fn){try{return await fn()}catch(e){toast(e.message,true)}}

/* modal form: ask('Title',[{name,label,type,ph}],'Button') -> values | null */
function ask(title,fields,ok,danger){return new Promise(res=>{
  const d=$('#dlg');
  d.innerHTML=`<form method="dialog"><h3>${esc(title)}</h3>${fields.map(f=>`<label for="f_${f.name}">${esc(f.label)}</label><input id="f_${f.name}" name="${f.name}" type="${f.type||'text'}" placeholder="${esc(f.ph||'')}" value="${esc(f.value||'')}" ${f.req===false?'':'required'} ${f.type==='number'?'step="0.01" min="0"':''} ${f.pin?'inputmode="numeric" maxlength="4" pattern="\\d{4}" autocomplete="off"':''}>`).join('')}
  <div class="btns"><button type="button" class="btn ghost" id="x">Cancel</button><button class="btn ${danger?'danger':''}">${esc(ok)}</button></div></form>`;
  let out=null;
  d.querySelector('form').onsubmit=e=>{out=Object.fromEntries(new FormData(e.target))};
  d.querySelector('#x').onclick=()=>d.close();
  d.onclose=()=>res(out);d.showModal();
});}
const confirmBox=(t,ok)=>ask(t,[],ok,true);

function logout(silent){if(!silent)api('/auth/logout','POST').catch(()=>{});session=null;sessionStorage.removeItem('dsp');route()}
function setSession(s){session=s;sessionStorage.setItem('dsp',JSON.stringify(s));route()}

/* ---------- login / register ---------- */
function authView(tab='customer'){
  const forms={
    customer:`<label>Account number</label><input name="accountNumber" inputmode="numeric" required autofocus><label>PIN</label><input name="pin" type="password" inputmode="numeric" maxlength="4" required><button class="btn">Log in</button><p class="hint">Demo account: 1234567890, PIN 1234.</p>`,
    open:`<label>Full name</label><input name="name" required autofocus><label>Choose a 4-digit PIN</label><input name="pin" type="password" inputmode="numeric" maxlength="4" pattern="\\d{4}" required><label>Opening deposit (₹)</label><input name="initialDeposit" type="number" min="0" step="0.01" value="1000" required><button class="btn gold">Open account</button>`,
    admin:`<label>Username</label><input name="username" required autofocus><label>Password</label><input name="password" type="password" required><button class="btn">Admin log in</button><p class="hint">Demo admin: admin / admin123.</p>`};
  $('#app').innerHTML=`<div class="auth"><section class="brand"><div class="logo">DSP Bank</div><div><h1>Your money, always in view.</h1><p>Check balances, move money and review every transaction in one place.</p>
  <div class="cardnum"><i></i><b>1234 5678 90</b><span style="color:#c3c9f3">Ravi · demo account</span></div></div><span class="muted" style="color:#9aa3e6">Built with Spring Boot and REST APIs</span></section>
  <section class="panel"><form class="form" id="af"><div class="tabs" role="tablist">${[['customer','Log in'],['open','Open account'],['admin','Admin']].map(([k,l])=>`<button type="button" role="tab" aria-selected="${k===tab}" data-t="${k}">${l}</button>`).join('')}</div>${forms[tab]}</form></section></div>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>authView(b.dataset.t));
  $('#af').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));run(async()=>{
    if(tab==='customer')setSession(await api('/auth/login','POST',{accountNumber:Number(v.accountNumber),pin:v.pin}));
    else if(tab==='admin')setSession(await api('/auth/admin/login','POST',v));
    else{const a=await api('/auth/register','POST',{name:v.name,pin:v.pin,initialDeposit:Number(v.initialDeposit)});
      await ask('Account created',[{name:'n',label:'Your account number (save it)',value:a.accountNumber}],'Continue to log in');authView('customer')}})};
}

/* ---------- customer ---------- */
async function customerView(){
  const [me,txs]=await Promise.all([api('/account/me'),api('/account/transactions?limit=50')]);
  $('#app').innerHTML=`<header class="top"><span class="logo">DSP Bank</span><span><span class="muted">${esc(me.name)}</span> <button class="btn ghost sm" id="lo">Log out</button></span></header>
  <main><section class="hero"><div><small>Available balance</small><div class="bal mono">${inr.format(me.balance)}</div></div><div style="text-align:right"><small>Account number</small><b class="mono">${me.accountNumber}</b></div></section>
  <div class="actions"><button class="btn" data-a="deposit">Deposit</button><button class="btn" data-a="withdraw">Withdraw</button><button class="btn gold" data-a="transfer">Transfer</button><button class="btn ghost" data-a="pin">Change PIN</button></div>
  <h2>Transactions</h2>${txs.length?`<div class="wrap"><table class="table"><tr><th>Date</th><th>Type</th><th>Amount</th><th>Balance after</th></tr>${txs.map(t=>{const inn=t.type==='DEPOSIT'||t.type==='TRANSFER_IN';return`<tr><td>${when(t.date)}</td><td>${TYPES[t.type]||t.type}${t.counterparty?` <span class="muted">· ${t.counterparty}</span>`:''}</td><td class="mono ${inn?'in':'out'}">${inn?'+':'−'}${inr.format(t.amount)}</td><td class="mono">${inr.format(t.balanceAfter)}</td></tr>`}).join('')}</table></div>`:`<div class="empty">No transactions yet. Make a deposit to get started.</div>`}</main>`;
  $('#lo').onclick=()=>logout();
  const acts={
    deposit:()=>ask('Deposit money',[{name:'amount',label:'Amount (₹)',type:'number'}],'Deposit').then(v=>v&&api('/account/deposit','POST',{amount:Number(v.amount)}).then(()=>'Deposited')),
    withdraw:()=>ask('Withdraw money',[{name:'amount',label:'Amount (₹)',type:'number'}],'Withdraw').then(v=>v&&api('/account/withdraw','POST',{amount:Number(v.amount)}).then(()=>'Withdrawn')),
    transfer:()=>ask('Transfer money',[{name:'to',label:'Receiver account number'},{name:'amount',label:'Amount (₹)',type:'number'}],'Send').then(v=>v&&api('/account/transfer','POST',{toAccount:Number(v.to),amount:Number(v.amount)}).then(()=>'Transfer sent')),
    pin:()=>ask('Change PIN',[{name:'o',label:'Current PIN',type:'password',pin:1},{name:'n',label:'New 4-digit PIN',type:'password',pin:1}],'Change PIN').then(v=>v&&api('/account/pin','PUT',{oldPin:v.o,newPin:v.n}).then(()=>'PIN changed'))};
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>run(async()=>{const m=await acts[b.dataset.a]();if(m){toast(m);customerView()}}));
}

/* ---------- admin ---------- */
async function adminView(){
  const [st,list]=await Promise.all([api('/admin/stats'),api('/admin/accounts')]);
  $('#app').innerHTML=`<header class="top"><span class="logo">DSP Bank · Admin</span><button class="btn ghost sm" id="lo">Log out</button></header>
  <main><div class="stats"><div class="stat"><span class="muted">Customers</span><b>${st.totalCustomers}</b></div><div class="stat"><span class="muted">Total deposits</span><b class="mono">${inr.format(st.totalBalance)}</b></div><div class="stat"><span class="muted">Blocked accounts</span><b>${st.blockedAccounts}</b></div><div class="stat"><span class="muted">Transactions</span><b>${st.totalTransactions}</b></div></div>
  <h2>Accounts</h2><input id="q" placeholder="Search by name or account number" style="max-width:340px;margin-bottom:.8rem">
  <div class="wrap"><table class="table"><tr><th>Account</th><th>Holder</th><th>Balance</th><th>Status</th><th>Actions</th></tr><tbody id="rows"></tbody></table></div></main>`;
  $('#lo').onclick=()=>logout();
  const draw=f=>{$('#rows').innerHTML=list.filter(a=>!f||(a.name+a.accountNumber).toLowerCase().includes(f)).map(a=>`<tr><td class="mono">${a.accountNumber}</td><td>${esc(a.name)}</td><td class="mono">${inr.format(a.balance)}</td><td><span class="pill ${a.status==='ACTIVE'?'ok':'bad'}">${a.status==='ACTIVE'?'Active':'Blocked'}</span></td>
   <td><div class="row-actions"><button class="btn ghost sm" data-e="${a.accountNumber}">Edit</button><button class="btn ghost sm" data-s="${a.accountNumber}" data-st="${a.status}">${a.status==='ACTIVE'?'Block':'Unblock'}</button><button class="btn ghost sm" data-p="${a.accountNumber}">Reset PIN</button><button class="btn danger sm" data-d="${a.accountNumber}">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No accounts match.</td></tr>'};
  draw('');$('#q').oninput=e=>draw(e.target.value.toLowerCase());
  $('#rows').onclick=e=>{const b=e.target.closest('button');if(!b)return;run(async()=>{let done;
    if(b.dataset.e){const a=list.find(x=>x.accountNumber==b.dataset.e),v=await ask('Edit account',[{name:'name',label:'Holder name',value:a.name},{name:'pin',label:'New PIN (leave blank to keep)',type:'password',pin:1,req:false}],'Save');if(v){await api('/admin/accounts/'+a.accountNumber,'PUT',{name:v.name,pin:v.pin||null});done='Account updated'}}
    else if(b.dataset.s){await api(`/admin/accounts/${b.dataset.s}/${b.dataset.st==='ACTIVE'?'block':'unblock'}`,'POST');done=b.dataset.st==='ACTIVE'?'Account blocked':'Account unblocked'}
    else if(b.dataset.p){const v=await ask('Reset PIN',[{name:'n',label:'New 4-digit PIN',type:'password',pin:1}],'Reset PIN');if(v){await api(`/admin/accounts/${b.dataset.p}/reset-pin`,'POST',{newPin:v.n});done='PIN reset'}}
    else if(b.dataset.d){if(await confirmBox('Delete account '+b.dataset.d+' and all its transactions? This cannot be undone.','Delete account')){await api('/admin/accounts/'+b.dataset.d,'DELETE');done='Account deleted'}}
    if(done){toast(done);adminView()}})};
}

function route(){
  if(!session)return authView();
  run(()=>session.role==='ADMIN'?adminView():customerView()).then(()=>{if(!session)authView()});
}
route();
</script>
</body>
</html>
