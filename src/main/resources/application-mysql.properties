# Set DB_USER and DB_PASSWORD, then run: mvn "-Dspring-boot.run.profiles=mysql" spring-boot:run
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dspbank?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
